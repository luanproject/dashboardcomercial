<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dashboard de Vendas</title>
<style>
:root{
  --bg:#f4f6f8; --surface:#ffffff; --ink:#14212b; --ink2:#46586a; --muted:#6b7a89; --line:#dde3e9; --line2:#eef1f4;
  --y0:#8fa1b3; --y1:#2a78d6; --accent:#2a78d6; --accent-soft:#e3eef9;
  --good:#17785a; --good-soft:#dff1ea; --bad:#b83a2c; --bad-soft:#f9e4e0; --warn:#9a6700; --warn-soft:#fbefd0;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161c; --surface:#17212a; --ink:#e6edf3; --ink2:#a9b8c6; --muted:#8696a5; --line:#2a3743; --line2:#202c36;
  --y0:#667a8d; --y1:#3987e5; --accent:#5aa0ee; --accent-soft:#1a2e3d;
  --good:#4fc79c; --good-soft:#15332b; --bad:#ff8a78; --bad-soft:#3a1f1b; --warn:#e5b94a; --warn-soft:#352a10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161c; --surface:#17212a; --ink:#e6edf3; --ink2:#a9b8c6; --muted:#8696a5; --line:#2a3743; --line2:#202c36;
  --y0:#667a8d; --y1:#3987e5; --accent:#5aa0ee; --accent-soft:#1a2e3d;
  --good:#4fc79c; --good-soft:#15332b; --bad:#ff8a78; --bad-soft:#3a1f1b; --warn:#e5b94a; --warn-soft:#352a10; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  padding:16px max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left))}
h1,h2,h3,h4{margin:0;line-height:1.2}
.wrap{max-width:1180px;margin:0 auto}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
header h1{font-size:22px}
header p{margin:4px 0 0;color:var(--ink2);font-size:13px}
header>div{min-width:0}
.icon-btn{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;min-width:40px;height:40px;cursor:pointer;font-size:16px}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);flex:1 1 130px;min-width:110px}
select,input[type=search]{font:14px system-ui,sans-serif;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;height:40px;padding:0 10px;width:100%}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:thin}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink2);padding:0 14px;height:40px;border-radius:99px;cursor:pointer;font:600 13px system-ui,sans-serif;white-space:nowrap}
.tab[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;min-width:0}
.card h3{font-size:15px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ch .srch{max-width:260px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.kpi .l{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:700;margin:4px 0 2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .s{font-size:12px;color:var(--ink2)}
.num,td.r,th.r{font-variant-numeric:tabular-nums}
.tag{display:inline-block;font:600 11.5px system-ui,sans-serif;padding:2px 8px;border-radius:99px;white-space:nowrap}
.tag.up{background:var(--good-soft);color:var(--good)} .tag.dn{background:var(--bad-soft);color:var(--bad)}
.tag.wr{background:var(--warn-soft);color:var(--warn)} .tag.neu{background:var(--line2);color:var(--ink2)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:600 11px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
th[data-sort]{cursor:pointer;user-select:none}
th.on{color:var(--ink)}
td{padding:8px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:0}
th.r,td.r{text-align:right;white-space:nowrap}
tr.row{cursor:pointer} tr.row:hover td{background:var(--line2)} tr.open td{background:var(--accent-soft)}
td .sub{display:block;color:var(--muted);font-size:11.5px}
.det td{background:var(--bg);padding:10px 12px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px}
.fact span{display:block;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.more{display:block;margin:10px auto 0;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 16px;height:40px;border-radius:8px;cursor:pointer;font:600 13px system-ui,sans-serif}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--ink2);height:34px;padding:0 12px;cursor:pointer;font:600 12.5px system-ui,sans-serif}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:0 0 6px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font:11px system-ui,sans-serif}
.chart .grid{stroke:var(--line2);stroke-width:1}
.tt{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);padding:7px 10px;border-radius:8px;font-size:12px;max-width:240px;display:none;line-height:1.5}
ul.ins{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
ul.ins li{display:flex;gap:9px;align-items:flex-start}
.dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--accent)}
.dot.g{background:var(--good)} .dot.r{background:var(--bad)} .dot.y{background:var(--warn)}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.cols2>.card{margin-bottom:0}
details.cli{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
details.cli>summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
details.cli>summary::-webkit-details-marker{display:none}
details.cli>summary .nm{font-weight:700;overflow-wrap:anywhere}
details.cli>summary .sm{color:var(--ink2);font-size:12.5px;grid-column:1/-1}
details.cli[open]>summary{border-bottom:1px solid var(--line)}
.cbody{padding:14px}
.bar{height:6px;background:var(--line2);border-radius:3px;overflow:hidden;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--y1);border-radius:3px}
h4.sec{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 0 8px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills span{background:var(--line2);border-radius:99px;padding:3px 10px;font-size:12.5px}
.note{font-size:12px;color:var(--muted)}
.foot{font-size:12px;color:var(--muted);margin-top:8px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:28px 18px;text-align:center;background:var(--surface)}
.drop h2{font-size:18px;margin-bottom:8px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:10px 12px;margin-top:12px;text-align:left}
.btn{display:inline-block;margin-top:12px;background:var(--accent);color:#fff;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}
.hbtns{display:flex;gap:8px;flex:none}
:root{--b0:#2a78d6;--b1:#e0792a;--b2:#4f9e4f;--b3:#8e6cc8;--onb:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--b0:#4b97ee;--b1:#f0a05f;--b2:#7cc47c;--b3:#b79be3;--onb:#0f161c}}
:root[data-theme="dark"]{--b0:#4b97ee;--b1:#f0a05f;--b2:#7cc47c;--b3:#b79be3;--onb:#0f161c}
.sq{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:7px;vertical-align:-1px}
.srow{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:center;margin:8px 0}
.srow>span{font-size:12px;color:var(--muted)}
.stack{display:flex;height:28px;gap:2px;border-radius:6px;overflow:hidden}
.stack i{display:block;height:100%;min-width:2px;font:600 11px/28px system-ui,sans-serif;color:var(--onb);text-align:center;overflow:hidden;white-space:nowrap}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:14px;margin-top:10px}
.pnl{border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
@media (max-width:640px){.mgrid{grid-template-columns:minmax(0,1fr)}}
.login{max-width:380px;margin:24px auto;display:flex;flex-direction:column;gap:12px;text-align:left;border-style:solid}
.login h2,.login>p{text-align:center;margin:0}
.login label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.login input:not([type=checkbox]){font:16px system-ui,sans-serif;height:44px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--bg);color:var(--ink);width:100%}
.login .chk{flex-direction:row;align-items:center;gap:8px;font-weight:400;font-size:13px;color:var(--ink2)}
.login .chk input{width:18px;height:18px}
.login .btn{border:0;font:600 15px system-ui,sans-serif;height:46px;cursor:pointer;margin-top:0}
.login .btn:disabled{opacity:.6;cursor:wait}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.chip{display:inline-flex;gap:6px;align-items:center;border-radius:99px;padding:4px 10px;font-size:12px;background:var(--line2);color:var(--ink2)}
.chip b{color:var(--ink);font-weight:600}
.chip.up{background:var(--good-soft);color:var(--good)} .chip.dn{background:var(--bad-soft);color:var(--bad)}
.chart text.up{fill:var(--good);font-weight:600} .chart text.dn{fill:var(--bad);font-weight:600}
.chart text.star{fill:var(--ink);font-size:12px} .chart .band{fill:var(--accent-soft)}
.lst{display:flex;flex-direction:column}
.lrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);align-items:flex-start;font-size:13px}
.lrow:last-child{border-bottom:0}
.lrow .t{min-width:0;overflow-wrap:anywhere}
.lrow .sub{display:block;color:var(--muted);font-size:11.5px}
.lrow .v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.filters label.full{flex:2 1 220px}
@media (max-width:640px){.filters{display:grid;grid-template-columns:1fr 1fr}.filters label,.filters label.full{min-width:0}.filters label.full{grid-column:1/-1}}
.pri{display:inline-block;font:600 11.5px system-ui,sans-serif;padding:3px 10px;border-radius:99px}
.pri.alta{background:var(--bad-soft);color:var(--bad)} .pri.media{background:var(--warn-soft);color:var(--warn)}
.plan{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.plan .pr{display:grid;grid-template-columns:84px minmax(0,1.8fr) minmax(0,1fr) minmax(0,1fr);gap:6px 14px;padding:10px 12px;border-bottom:1px solid var(--line2);align-items:start;font-size:13px}
.plan .pr:last-child{border-bottom:0}
.plan .ph{font:600 11px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:1px solid var(--line)}
.plan small{display:none;color:var(--muted);font-weight:600;margin-right:4px}
@media (max-width:640px){.plan .ph{display:none}.plan .pr{grid-template-columns:minmax(0,1fr)}.plan small{display:inline}}
@media (max-width:640px){
  body{padding-top:12px}
  header h1{font-size:19px}
  .hm{display:none}
  .kpi .v{font-size:19px}
  .ch .srch{max-width:none;width:100%}
  .cols2{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="ttl">Dashboard de Vendas</h1>
      <p id="sub">Carregando dados…</p>
    </div>
    <div class="hbtns">
      <button class="icon-btn" id="sair" hidden title="Sair e voltar para a tela de login" style="padding:0 12px;font:600 13px system-ui,sans-serif">Sair</button>
      <button class="icon-btn" id="theme" title="Alternar tema claro/escuro" aria-label="Alternar tema" style="padding:0 12px;font:600 13px system-ui,sans-serif">Tema</button>
    </div>
  </header>
  <div id="loader"></div>
  <main id="main" hidden>
    <div class="filters" id="filters"></div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <section id="view"></section>
    <p class="foot" id="foot"></p>
  </main>
</div>
<div class="tt" id="tt"></div>

<script>
(function(){
'use strict';
/* =====================================================================
   1. LEITURA DA PLANILHA (.xlsx ou .csv) — roda no navegador, sem instalar nada
   ===================================================================== */
/* O site só procura o arquivo CRIPTOGRAFADO dados.enc (gerado por criptografar.html). Nenhuma planilha em texto aberto é publicada. */

async function inflateRaw(u8){
  const ds=new DecompressionStream('deflate-raw');
  const stream=new Blob([u8]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function unzip(buf){
  const u8=new Uint8Array(buf), dv=new DataView(buf), out={};
  let e=u8.length-22; while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw new Error('Arquivo .xlsx inválido');
  const n=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true);
  const td=new TextDecoder();
  for(let i=0;i<n;i++){
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true);
    const nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), lo=dv.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nl)); p+=46+nl+el+cl;
    const ds=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true);
    const raw=u8.subarray(ds,ds+csize);
    out[name]=(()=>method===0?Promise.resolve(raw):inflateRaw(raw));
  }
  return out;
}
const xml=t=>new DOMParser().parseFromString(t,'application/xml');
const colIdx=ref=>{let n=0;for(const ch of ref.replace(/\d/g,''))n=n*26+ch.charCodeAt(0)-64;return n-1};
async function lerXlsx(buf){
  const z=await unzip(buf), td=new TextDecoder();
  const get=async n=>z[n]?td.decode(await z[n]()):null;
  const ss=[], ssx=await get('xl/sharedStrings.xml');
  if(ssx){for(const si of xml(ssx).getElementsByTagName('si')){
    ss.push([...si.getElementsByTagName('t')].map(t=>t.textContent).join(''))}}
  const sheetName=Object.keys(z).filter(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort((a,b)=>parseInt(a.match(/\d+/g).pop())-parseInt(b.match(/\d+/g).pop()))[0];
  if(!sheetName)throw new Error('Nenhuma aba encontrada na planilha');
  const doc=xml(await get(sheetName)), rows=[];
  for(const r of doc.getElementsByTagName('row')){
    const arr=[];
    for(const c of r.getElementsByTagName('c')){
      const t=c.getAttribute('t'), v=c.getElementsByTagName('v')[0], i=colIdx(c.getAttribute('r')||'A1');
      let val='';
      if(t==='s'&&v)val=ss[+v.textContent]??'';
      else if(t==='inlineStr')val=[...c.getElementsByTagName('t')].map(x=>x.textContent).join('');
      else if(t==='str'||t==='e')val=v?v.textContent:'';
      else if(t==='b')val=v&&v.textContent==='1'?1:0;
      else val=v&&v.textContent!==''?+v.textContent:'';
      arr[i]=val;
    }
    rows.push(arr);
  }
  return rows;
}
function lerCsv(texto){
  const first=texto.split(/\r?\n/,1)[0], sep=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<texto.length;i++){
    const ch=texto[i];
    if(q){ if(ch==='"'){ if(texto[i+1]==='"'){cur+='"';i++} else q=false } else cur+=ch }
    else if(ch==='"')q=true;
    else if(ch===sep){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&texto[i+1]==='\n')i++; row.push(cur);cur='';rows.push(row);row=[] }
    else cur+=ch;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(x=>x!==''));
}

/* ---- transforma as linhas da planilha em registros padronizados ---- */
const norm=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const num=v=>{
  if(typeof v==='number')return v;
  if(v==null||v===''||v==='-')return 0;
  let s=String(v).trim().replace(/\s|R\$/g,'');
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  const n=parseFloat(s);return isNaN(n)?0:n;
};
function padronizar(tabela){
  const head=(tabela[0]||[]).map(norm), usadas=new Set();
  const find=(...ops)=>{for(const o of ops){const i=head.findIndex(h=>typeof o==='string'?h===o:o.test(h));if(i>=0){usadas.add(i);return i}}return -1};
  const cCli=find('clientematrizrazao',/^clientematriz/,'cliente','clientenome');
  const cMes=find('mes'), cCod=find('clientecodigo','codigocliente');
  const cItem=find('item'), cItemC=find('itemcodigo');
  const cLinha=find('linhacomercial'), cFam=find('familiacomercial');
  const cUf=find('estado','uf'), cEmp=find('grupoempresa','empresa');
  const liq=[],qtd=[];
  head.forEach((h,i)=>{let m=h.match(/^rliquido(\d{4})$/);if(m)liq.push([+m[1],i]);m=h.match(/^qtdlt(\d{4})$/);if(m)qtd.push([+m[1],i])});
  liq.sort((a,b)=>a[0]-b[0]);qtd.sort((a,b)=>a[0]-b[0]);
  const cMc=find('rmc');
  const faltam=[];
  if(cCli<0)faltam.push('Cliente - Matriz Razão');
  if(cMes<0)faltam.push('Mês');
  if(cFam<0&&cItem<0)faltam.push('Família Comercial ou Item');
  if(liq.length<2)faltam.push('R$ Líquido <ano anterior> e R$ Líquido <ano atual> (ex.: R$ Líquido 2025 e R$ Líquido 2026)');
  if(faltam.length)throw new Error('Colunas não encontradas na planilha: '+faltam.join('; ')+'.');
  liq.slice(-2).forEach(x=>usadas.add(x[1]));qtd.slice(-2).forEach(x=>usadas.add(x[1]));
  const [y0,i0]=liq[liq.length-2],[y1,i1]=liq[liq.length-1];
  const q0=(qtd.find(x=>x[0]===y0)||[0,-1])[1], q1=(qtd.find(x=>x[0]===y1)||[0,-1])[1];
  const txt=(r,i,d)=>i<0||r[i]===undefined||r[i]===''?d:String(r[i]).trim();
  const rows=[];let descartadas=0;
  for(let k=1;k<tabela.length;k++){
    const r=tabela[k]; if(!r||!r.length)continue;
    const m=MES.indexOf(txt(r,cMes,'').toLowerCase().slice(0,3));
    const cli=txt(r,cCli,'');
    if(m<0||!cli){descartadas++;continue}
    rows.push({cli,cod:txt(r,cCod,''),mes:m,item:txt(r,cItem,'—'),itemc:txt(r,cItemC,''),linha:txt(r,cLinha,'—'),fam:txt(r,cFam,txt(r,cItem,'—')),
      uf:txt(r,cUf,'—'),emp:txt(r,cEmp,'—'),a:num(r[i0]),b:num(r[i1]),qa:q0<0?0:num(r[q0]),qb:q1<0?0:num(r[q1]),mc:cMc<0?0:num(r[cMc])});
  }
  if(!rows.length)throw new Error('A planilha não tem linhas válidas (confira as colunas Cliente e Mês).');
  const ignoradas=(tabela[0]||[]).filter((_,i)=>!usadas.has(i)&&String(tabela[0][i]).trim()!=='');
  /* um código de item com mais de um nome: usa o nome mais frequente */
  const nomesItem=new Map();rows.forEach(r=>{if(!r.itemc)return;let m=nomesItem.get(r.itemc);if(!m)nomesItem.set(r.itemc,m=new Map());m.set(r.item,(m.get(r.item)||0)+1)});
  const melhor=new Map();let itensMultiNome=0;
  nomesItem.forEach((m,k)=>{if(m.size>1)itensMultiNome++;melhor.set(k,[...m].sort((a,b)=>b[1]-a[1])[0][0])});
  rows.forEach(r=>{if(r.itemc)r.item=melhor.get(r.itemc)});
  return {rows,y0,y1,temMc:cMc>=0,temQtd:q1>=0,ignoradas,colunasLidas:head.length,descartadas,itensMultiNome,totalLinhas:Math.max(0,tabela.length-1)};
}

/* =====================================================================
   2. ESTADO, FORMATAÇÃO E CÁLCULOS

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const BRL2=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:2});
const NUM=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0});
const fR=v=>BRL.format(Math.round(v));
const fC=v=>{const a=Math.abs(v),s=v<0?'−':'';if(a>=1e6)return s+'R$ '+(a/1e6).toFixed(2).replace('.',',')+' mi';if(a>=1e4)return s+'R$ '+Math.round(a/1e3)+' mil';return s+fR(a)};
const fD=v=>(v>=0?'+':'−')+fC(Math.abs(v));
const fL=v=>NUM.format(Math.round(v))+' L';
const fP=(x,d=1)=>(x*100).toFixed(d).replace('.',',')+'%';
const pct=(a,b)=>a>0?b/a-1:null;
const fV=p=>p==null?'novo':(p>=0?'+':'−')+Math.abs(p*100).toFixed(1).replace('.',',')+'%';
const cls=p=>p==null?'neu':(p>=0.0005?'up':(p<=-0.0005?'dn':'neu'));
const arrow=p=>p==null?'':(p>=0.0005?'▲ ':(p<=-0.0005?'▼ ':''));
const vtag=(a,b)=>{if(a<=0&&b<=0)return '<span class="tag neu">—</span>';const p=pct(a,b);return `<span class="tag ${cls(p)}">${arrow(p)}${fV(p)}</span>`};
const status=(a,b)=>{if(b>0&&a<=0)return['Novo','up'];if(a>0&&b<=0)return['Perdido','dn'];if(a>0&&b<a*0.9)return['Em queda','wr'];if(a>0&&b>a*1.1)return['Em alta','up'];if(b>0)return['Estável','neu'];return['—','neu']};
const stag=(a,b)=>{const [t,c]=status(a,b);return `<span class="tag ${c}">${t}</span>`};
const Z=()=>({a:0,b:0,qa:0,qb:0,mc:0});
const add=(o,r)=>{o.a+=r.a;o.b+=r.b;o.qa+=r.qa;o.qb+=r.qb;o.mc+=r.mc;return o};
const sum=rows=>rows.reduce(add,Z());
function group(rows,kf){const m=new Map();for(const r of rows){const k=kf(r);let o=m.get(k);if(!o){o=Z();m.set(k,o)}add(o,r)}return m}
const ents=(m,extra)=>[...m].map(([k,o])=>Object.assign({key:k,name:k},o,extra?extra(k,o):{}));
const li=(k,t)=>`<li><span class="dot ${k}"></span><span>${t}</span></li>`;

const S={tab:'res',emp:'',uf:'',cli:'',m0:0,m1:11,metric:'b',sort:{},q:{},lim:{},exp:new Set(),open:new Set()};

/* =====================================================================
   3. GRÁFICO MENSAL (SVG, responsivo)
   ===================================================================== */
const MESC=MES.map(m=>m[0].toUpperCase()+m.slice(1));
function niceMax(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
function barPath(x,y,w,h,r){r=Math.min(r,w/2,h);return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`}
function drawChart(el,cfg){
  const both=cfg.a!=null, st=cfg.hl&&cfg.ms.length>1?chartStats(cfg):null;
  const W=Math.max(el.clientWidth||320,260),H=cfg.h||230,pl=46,pr=6,pt=st?(both?28:18):8,pb=24,n=cfg.ms.length;
  const mx=niceMax(Math.max(1e-9,...(both?cfg.a:[0]),...cfg.b)), ih=H-pt-pb, step=(W-pl-pr)/n;
  const bw=Math.max(4,Math.min(both?18:30,(step-8)/(both?2:1))), fmt=cfg.fmt;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(cfg.label)}">`;
  for(let i=0;i<=4;i++){const y=pt+ih-ih*i/4;s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${fmt(mx*i/4,true)}</text>`}
  if(st&&both)s+=`<text x="${pl-6}" y="12" text-anchor="end">vs ${META.y0}</text>`;
  cfg.ms.forEach((m,i)=>{
    const cx=pl+step*i+step/2, ya=both?Math.max(0,cfg.a[i]):0, yb=Math.max(0,cfg.b[i]);
    const ha=ih*ya/mx, hb=ih*yb/mx;
    const bestA=!!st&&both&&i===st.bestA, bestB=!!st&&i===st.bestB, so=f=>f?' stroke="var(--ink)" stroke-width="1.5"':'';
    if(bestA||bestB)s+=`<rect class="band" x="${pl+step*i+1}" y="${pt-2}" width="${step-2}" height="${ih+2}" rx="6"/>`;
    if(both){
      s+=`<path d="${barPath(cx-bw-1,pt+ih-ha,bw,ha,4)}" fill="var(--y0)"${so(bestA)}/><path d="${barPath(cx+1,pt+ih-hb,bw,hb,4)}" fill="var(--y1)"${so(bestB)}/>`;
      if(bestA)s+=`<text class="star" text-anchor="middle" x="${cx-bw/2-1}" y="${pt+ih-ha-4}">★</text>`;
      if(bestB)s+=`<text class="star" text-anchor="middle" x="${cx+bw/2+1}" y="${pt+ih-hb-4}">★</text>`;
      if(st){const p=pct(cfg.a[i],cfg.b[i]);if(p!=null&&Math.abs(p)>=0.0005)s+=`<text class="${p>=0?'up':'dn'}" x="${cx}" y="12" text-anchor="middle">${p>=0?'▲':'▼'}${step<46?'':' '}${step<46&&Math.abs(p)>=1?'99+':Math.abs(p*100).toFixed(0)}${step<46?'':'%'}</text>`}
    }else{
      s+=`<path d="${barPath(cx-bw/2,pt+ih-hb,bw,hb,4)}" fill="var(--y1)"${so(bestB)}/>`;
      if(bestB)s+=`<text class="star" text-anchor="middle" x="${cx}" y="${pt+ih-hb-4}">★</text>`;
    }
    s+=`<text x="${cx}" y="${H-7}" text-anchor="middle">${MESC[m]}</text>`;
    s+=`<rect x="${pl+step*i}" y="${pt}" width="${step}" height="${ih+pb}" fill="transparent" data-i="${i}" class="hit"/>`;
  });
  s+='</svg>';
  el.innerHTML=s;
  const tt=$('#tt');
  const show=(e,i)=>{
    let h=`<b>${MESC[cfg.ms[i]]}</b><br>`;
    if(both){const p=pct(cfg.a[i],cfg.b[i]);h+=`${META.y0}: ${fmt(cfg.a[i])}<br>${META.y1}: ${fmt(cfg.b[i])}<br>${p==null?'—':fV(p)+' vs '+META.y0}`}
    else h+=`${META.y1}: ${fmt(cfg.b[i])}`+(cfg.extra?'<br>'+cfg.extra(i):'');
    tt.innerHTML=h;tt.style.display='block';
    const w=tt.offsetWidth,x=Math.min(Math.max(8,e.clientX+12),innerWidth-w-8),y=Math.max(8,e.clientY-tt.offsetHeight-12);
    tt.style.left=x+'px';tt.style.top=y+'px';
  };
  el.querySelectorAll('.hit').forEach(r=>{
    r.addEventListener('pointermove',e=>show(e,+r.dataset.i));
    r.addEventListener('pointerdown',e=>show(e,+r.dataset.i));
    r.addEventListener('pointerleave',()=>tt.style.display='none');
  });
}
/* destaques do gráfico: melhor mês de cada ano, maior alta e maior queda mês a mês */
function chartStats(cfg){
  const both=cfg.a!=null, arg=arr=>arr.reduce((bi,v,i)=>v>arr[bi]?i:bi,0);
  let up=-1,dn=-1,pu=-Infinity,pd=Infinity;
  if(both)cfg.b.forEach((v,i)=>{const p=pct(cfg.a[i],v);if(p==null)return;if(p>pu){pu=p;up=i}if(p<pd){pd=p;dn=i}});
  return {bestA:both?arg(cfg.a):-1,bestB:arg(cfg.b),up,dn,pu,pd};
}
function chips(cfg){
  const st=chartStats(cfg),f=v=>cfg.fmt(v),both=cfg.a!=null,m=i=>MESC[cfg.ms[i]];
  let h='<div class="chips">';
  if(both)h+=`<span class="chip"><b>★ Melhor mês ${META.y0}</b> ${m(st.bestA)} · ${f(cfg.a[st.bestA])}</span>`;
  h+=`<span class="chip"><b>★ Melhor mês ${META.y1}</b> ${m(st.bestB)} · ${f(cfg.b[st.bestB])}</span>`;
  if(both&&st.up>=0&&st.pu>0)h+=`<span class="chip up">Maior alta: ${m(st.up)} ${fV(st.pu)}</span>`;
  if(both&&st.dn>=0&&st.pd<0)h+=`<span class="chip dn">Maior queda: ${m(st.dn)} ${fV(st.pd)}</span>`;
  return h+'</div>';
}
function chartBox(id,cfg,legend){
  CHARTS[id]=cfg;
  return `${legend?`<div class="leg"><span><i style="background:var(--y0)"></i>${META.y0}</span><span><i style="background:var(--y1)"></i>${META.y1}</span></div>`:''}${cfg.hl&&cfg.ms.length>1?chips(cfg):''}<div class="chart" data-chart="${id}"></div>`;
}
function monthSeries(rows){
  const ms=[];for(let m=S.m0;m<=S.m1;m++)if(META.months.includes(m))ms.push(m);
  const g=group(rows,r=>r.mes);
  return {ms,t:ms.map(m=>g.get(m)||Z())};
}

/* =====================================================================
   4. TABELA DE RANKING (busca, ordenação, detalhe por cliente)

function rankCard(id,title,entries,keyFn,opt={}){
  TABLES[id]={entries,keyFn,opt,total:C.tot};
  S.sort[id]=S.sort[id]||{k:'b',d:-1};
  return `<div class="card"><div class="ch"><h3>${title}</h3>${opt.search?`<input class="srch" type="search" placeholder="Buscar…" data-q="${id}" value="${esc(S.q[id]||'')}" aria-label="Buscar">`:''}</div><div id="t-${id}"></div></div>`;
}
function sortVal(e,k,T){
  switch(k){case'name':return e.name.toLowerCase();case'a':return e.a;case'b':return e.b;
    case'var':{const p=pct(e.a,e.b);return p==null?(e.b>0?1e9:-1e9):p}
    case'share':return e.b;case'qb':return e.qb;case'mcp':return e.b>0?e.mc/e.b:-1;default:return e.b}}
function drawTable(id){
  const T=TABLES[id],el=$('#t-'+id);if(!el)return;
  const so=S.sort[id],q=(S.q[id]||'').toLowerCase().trim();
  let list=T.entries.filter(e=>(e.a!==0||e.b!==0)&&(!q||(e.name+' '+(e.sub||'')).toLowerCase().includes(q)));
  list.sort((x,y)=>{const a=sortVal(x,so.k),b=sortVal(y,so.k);return (a<b?-1:a>b?1:0)*so.d});

  const th=(k,l,cl='')=>`<th class="${cl} ${so.k===k?'on':''}" data-sort="${id}|${k}">${l}${so.k===k?(so.d<0?' ↓':' ↑'):''}</th>`;
  let h=`<div class="tw"><table><thead><tr>${th('name','Nome')}${th('a',META.y0,'r hm')}${th('b',META.y1,'r')}${th('var','Var.','r')}${th('share','% do total','r hm')}${META.temMc?th('mcp','MC %','r hm'):''}<th class="hm">Situação</th></tr></thead><tbody>`;
  for(const e of shown){
    const ek=id+'|'+e.key, op=S.exp.has(ek);
    h+=`<tr class="row ${op?'open':''}" data-exp="${esc(ek)}"><td>${esc(e.name)}${e.sub?`<span class="sub">${esc(e.sub)}</span>`:''}</td><td class="r hm">${fC(e.a)}</td><td class="r">${fC(e.b)}</td><td class="r">${vtag(e.a,e.b)}</td><td class="r hm">${tb>0?fP(e.b/tb):'—'}</td>${META.temMc?`<td class="r hm">${e.b>0?fP(e.mc/e.b):'—'}</td>`:''}<td class="hm">${stag(e.a,e.b)}</td></tr>`;
    if(op)h+=`<tr class="det"><td colspan="7">${detalhe(T,e)}</td></tr>`;

function detalhe(T,e){
  const rows=C.rows.filter(r=>T.keyFn(r)===e.key), byC=ents(group(rows,r=>r.cli)).sort((x,y)=>y.b-x.b||y.a-x.a);

  if(META.temMc)h+=`<div class="fact"><span>MC % ${META.y1}</span>${e.b>0?fP(e.mc/e.b):'—'} · ${fR(e.mc)}</div>`;
  h+=`<div class="fact"><span>Situação</span>${stag(e.a,e.b)}</div></div>`;
  h+=`<div class="tw"><table><thead><tr><th>Cliente</th><th class="r">${META.y0}</th><th class="r">${META.y1}</th><th class="r">Var.</th></tr></thead><tbody>${byC.map(c=>`<tr><td>${esc(c.name)}</td><td class="r">${fC(c.a)}</td><td class="r">${fC(c.b)}</td><td class="r">${vtag(c.a,c.b)}</td></tr>`).join('')}</tbody></table></div>`;
  return h;

/* =====================================================================
   5. INSIGHTS
   ===================================================================== */
const nomes=(arr,n=3)=>arr.slice(0,n).map(x=>esc(x.name)).join(', ');
function insightsCarteira(){
  const t=C.tot, ls=[], cl=ents(group(C.rows,r=>r.cli)).sort((x,y)=>y.b-x.b);
  const p=pct(t.a,t.b);
  if(t.a>0)ls.push(li(p>=0?'g':'r',`Receita líquida <b>${fV(p)}</b> sobre ${META.y0} (${fD(t.b-t.a)}), de ${fC(t.a)} para ${fC(t.b)}.`));
  if(cl.length>1){
    const top=cl.slice(0,Math.min(3,cl.length)),sh=top.reduce((s,x)=>s+x.b,0)/(t.b||1);
    ls.push(li(sh>0.8?'y':'',`<b>${top.length} clientes</b> (${nomes(top,top.length)}) concentram <b>${fP(sh)}</b> da receita de ${META.y1}.`));
    const dd=[...cl].sort((x,y)=>(y.b-y.a)-(x.b-x.a)), up=dd[0], dn=dd[dd.length-1];
    if(up.b-up.a>0)ls.push(li('g',`Maior crescimento: <b>${esc(up.name)}</b> (${fD(up.b-up.a)}).`));
    if(dn.b-dn.a<0)ls.push(li('r',`Maior queda: <b>${esc(dn.name)}</b> (${fD(dn.b-dn.a)}).`));
    const perd=cl.filter(x=>x.a>0&&x.b<=0);
    if(perd.length)ls.push(li('r',`Sem compras em ${META.y1}: <b>${nomes(perd,5)}</b>.`));
  }
  const {ms,t:ser}=monthSeries(C.rows);
  if(ms.length>1){
    const idx=ser.map((o,i)=>i), best=idx.reduce((a,b)=>ser[b].b>ser[a].b?b:a), worst=idx.reduce((a,b)=>ser[b].b<ser[a].b?b:a);
    const quedas=ser.filter(o=>o.b<o.a).length;
    ls.push(li(quedas>ms.length/2?'y':'',`${quedas} de ${ms.length} meses ficaram abaixo de ${META.y0}. Melhor mês: <b>${MESC[ms[best]]}</b> (${fC(ser[best].b)}); mais fraco: <b>${MESC[ms[worst]]}</b> (${fC(ser[worst].b)}).`));
    const l=ser.length-1;if(ser[l].a>0)ls.push(li(ser[l].b>=ser[l].a?'g':'r',`Último mês (${MESC[ms[l]]}): <b>${fV(pct(ser[l].a,ser[l].b))}</b> vs ${MESC[ms[l]]}/${String(META.y0).slice(2)} (${fC(ser[l].b)}).`));
  }
  const fam=ents(group(C.rows,r=>r.fam)), qd=fam.filter(x=>x.a>0).sort((x,y)=>(x.b-x.a)-(y.b-y.a)), al=[...qd].reverse();
  if(qd.length&&qd[0].b-qd[0].a<0)ls.push(li('r',`Famílias que mais caíram: ${qd.slice(0,3).filter(x=>x.b<x.a).map(x=>`<b>${esc(x.name)}</b> (${fD(x.b-x.a)})`).join(', ')}.`));
  if(al.length&&al[0].b-al[0].a>0)ls.push(li('g',`Famílias que mais cresceram: ${al.slice(0,3).filter(x=>x.b>x.a).map(x=>`<b>${esc(x.name)}</b> (${fD(x.b-x.a)})`).join(', ')}.`));
  if(META.temQtd&&t.qa>0&&t.qb>0){const pa=t.a/t.qa,pb=t.b/t.qb;ls.push(li('',`Preço médio de <b>${BRL2.format(pb)}/L</b> (${fV(pct(pa,pb))} vs ${META.y0}). Volume ${fV(pct(t.qa,t.qb))}.`))}
  if(META.temMc&&t.b>0&&cl.length>1){
    const mm=cl.filter(x=>x.b>0).map(x=>({name:x.name,m:x.mc/x.b,v:x.b})).sort((x,y)=>y.m-x.m);
    ls.push(li('',`MC de <b>${fP(t.mc/t.b)}</b> sobre a receita (${fC(t.mc)}). Maior margem: <b>${esc(mm[0].name)}</b> (${fP(mm[0].m)}); menor: <b>${esc(mm[mm.length-1].name)}</b> (${fP(mm[mm.length-1].m)}).`));
  }
  const aten=x=>/class="dot (r|y)"/.test(x);
  return {f:ls.filter(x=>!aten(x)).join(''),a:ls.filter(aten).join('')};
}
const codLbl=(cli,cod)=>{if(!cod)return '';const u=((META.cods[cli]||[]).find(x=>x.cod===cod)||{}).uf;return `cód. ${cod}${u&&u!=='—'?' · '+u:''}`};
/* blocos da tela inicial: pontos fortes/atenção, famílias, onde agir, oportunidades de mix e plano de ação */
function blocosResumo(){
  const rows=C.rows,all=C.rowsAll,y0=META.y0,y1=META.y1,ins=insightsCarteira(),SEP='\u0001';
  const fam=ents(group(rows,r=>r.fam));
  const quedas=fam.filter(x=>x.b<x.a).sort((x,y)=>(x.b-x.a)-(y.b-y.a)).slice(0,5);
  const altas=fam.filter(x=>x.b>x.a).sort((x,y)=>(y.b-y.a)-(x.b-x.a)).slice(0,5);

  const perdidos=pares.filter(x=>x.a>0&&x.b<=0).sort((x,y)=>y.a-x.a);
  const emQueda=pares.filter(x=>x.a>0&&x.b>0&&x.b<x.a).sort((x,y)=>(x.b-x.a)-(y.b-y.a));
  const sub=x=>esc(x.cli)+(x.cod?' · '+esc(codLbl(x.cli,x.cod)):'');
  const rowF=(x,dn)=>`<div class="lrow"><span class="t">${esc(x.name)}</span><span class="v">${fC(x.a)} → ${fC(x.b)} <span class="tag ${dn?'dn':'up'}">${fD(x.b-x.a)}</span></span></div>`;
  const rowP=x=>`<div class="lrow"><span class="t">${esc(x.name)}<span class="sub">${sub(x)}</span></span><span class="v">${fC(x.a)}</span></div>`;
  const rowQ=x=>`<div class="lrow"><span class="t">${esc(x.name)}<span class="sub">${sub(x)}</span></span><span class="v">${fC(x.a)} → ${fC(x.b)}<span class="sub"><span class="tag dn">${fD(x.b-x.a)}</span></span></span></div>`;
  const vazio='<p class="note">Nenhum.</p>';
  const cardFam=`<div class="card"><h3 style="margin-bottom:8px">Famílias que mais caíram</h3><div class="lst">${quedas.map(x=>rowF(x,true)).join('')||vazio}</div><h3 style="margin:18px 0 8px">Famílias que mais cresceram</h3><div class="lst">${altas.map(x=>rowF(x,false)).join('')||vazio}</div></div>`;
  const cardAcao=`<div class="card"><h3>Onde agir primeiro</h3><p class="note" style="margin:2px 0 0">Combinações de cliente × família.</p><h4 class="sec" style="margin-top:12px">Perdidos (maiores de ${y0})</h4><div class="lst">${perdidos.slice(0,6).map(rowP).join('')||vazio}</div><h4 class="sec">Em queda (maior perda em R$)</h4><div class="lst">${emQueda.slice(0,6).map(rowQ).join('')||vazio}</div></div>`;
  /* oportunidades de mix */
  const sel=S.cli?(r=>S.cli[0]==='m'?r.cli===S.cli.slice(2):r.cod===S.cli.slice(2)):null;
  const base=sel?all.filter(r=>!sel(r)):all;
  const ativos=[...group(base,r=>r.cli)].filter(([k,o])=>o.b>0).length;
  const byFam=new Map();
  group(base,r=>r.fam+SEP+r.cli).forEach((o,k)=>{if(o.b<=0)return;const f=k.split(SEP)[0];let e=byFam.get(f);if(!e){e={name:f,n:0,tot:0};byFam.set(f,e)}e.n++;e.tot+=o.b});
  let mix;
  if(!sel)mix=[...byFam.values()].filter(e=>e.n>=2&&ativos-e.n>=1).map(e=>({...e,sem:ativos-e.n,ticket:e.tot/e.n,pot:(ativos-e.n)*e.tot/e.n}));
  else{const mine=new Set(fam.filter(x=>x.b>0).map(x=>x.name));mix=[...byFam.values()].filter(e=>!mine.has(e.name)).map(e=>({...e,sem:1,ticket:e.tot/e.n,pot:e.tot/e.n}))}
  mix=mix.sort((x,y)=>y.pot-x.pot).slice(0,8);
  const cardMix=`<div class="card"><h3>Oportunidades de mix (inferidas)</h3><p class="note" style="margin:2px 0 10px">${sel?'Famílias que os demais clientes compram e que este cliente ainda não compra. Potencial = ticket médio de quem compra.':'Famílias que pelo menos 2 clientes compram e que outros clientes ativos ainda não compram. Potencial = clientes sem a família × ticket médio de quem compra.'} Não é garantia de resultado.</p>${mix.length?`<div class="tw"><table><thead><tr><th>Família</th><th class="r">Compram</th>${sel?'':'<th class="r hm">Ativos sem a família</th>'}<th class="r hm">Ticket</th><th class="r">Potencial</th></tr></thead><tbody>${mix.map(e=>`<tr><td>${esc(e.name)}</td><td class="r">${e.n}</td>${sel?'':`<td class="r hm">${e.sem}</td>`}<td class="r hm">${fC(e.ticket)}</td><td class="r"><b>${fC(e.pot)}</b></td></tr>`).join('')}</tbody></table></div>`:'<p class="note">Nenhuma oportunidade encontrada para os filtros atuais.</p>'}</div>`;
  /* plano de ação */
  const plano=[];
  if(perdidos.length)plano.push({p:'alta',a:`Reativar famílias perdidas, começando por: ${perdidos.slice(0,3).map(x=>`${esc(x.name)} (${esc(x.cli)})`).join('; ')}`,e:`${perdidos.length} combinações cliente × família sem compra em ${y1}, somando ${fC(perdidos.reduce((s,x)=>s+x.a,0))} em ${y0}`,i:`Receita de ${y0} recuperável (fato)`});
  const lblCod=k=>META.codMat[k]?`${esc(META.codMat[k])} (${esc(codLbl(META.codMat[k],k))})`:esc(k);
  const cods=ents(group(rows,r=>r.cod||r.cli));
  const cQueda=cods.filter(x=>x.a>0&&x.b>0&&x.b<x.a).sort((x,y)=>(x.b-x.a)-(y.b-y.a));
  if(cQueda.length)plano.push({p:'alta',a:`Visitar clientes em queda: ${cQueda.slice(0,3).map(x=>lblCod(x.key)).join('; ')}`,e:`Queda somada de ${fD(cQueda.slice(0,6).reduce((s,x)=>s+x.b-x.a,0))} nos ${Math.min(6,cQueda.length)} maiores`,i:`Voltar ao patamar de ${y0}`});
  if(mix.length)plano.push({p:'media',a:`Ofertar ${esc(mix[0].name)} aos clientes que ainda não compram`,e:sel?`${mix[0].n} ${mix[0].n>1?'clientes compram':'cliente compra'} a família`:`${mix[0].sem} clientes ativos sem a família; ${mix[0].n} compram`,i:`Inferido: ${fC(mix[0].pot)}`});
  const cZero=cods.filter(x=>x.a>0&&x.b<=0).sort((x,y)=>y.a-x.a);
  if(cZero.length)plano.push({p:'media',a:`Retomar ${cZero.length>1?'os clientes':'o cliente'} ${cZero.slice(0,3).map(x=>lblCod(x.key)).join('; ')}`,e:`Tinha ${fC(cZero.reduce((s,x)=>s+x.a,0))} em ${y0} e zerou`,i:`Receita de ${y0} recuperável`});
  const lin=ents(group(rows,r=>r.linha)).filter(x=>x.b<x.a).sort((x,y)=>(x.b-x.a)-(y.b-y.a))[0];
  if(lin&&lin.name!=='—')plano.push({p:'media',a:`Plano de recuperação da linha ${esc(lin.name)}`,e:`${fD(lin.b-lin.a)} contra ${y0}`,i:`Receita de ${y0} recuperável`});
  const cardPlano=`<div class="card"><h3 style="margin-bottom:10px">Plano de ação sugerido</h3>${plano.length?`<div class="plan"><div class="pr ph"><span>Prioridade</span><span>Ação</span><span>Evidência</span><span>Impacto</span></div>${plano.map(x=>`<div class="pr"><span><span class="pri ${x.p}">${x.p==='alta'?'Alta':'Média'}</span></span><span>${x.a}</span><span><small>Evidência:</small>${x.e}</span><span><small>Impacto:</small>${x.i}</span></div>`).join('')}</div>`:'<p class="note">Sem ações sugeridas para os filtros atuais.</p>'}<p class="note" style="margin-top:8px">Sugestões geradas automaticamente a partir dos números; confirme com o que você sabe de cada cliente.</p></div>`;
  return `<div class="cols2" style="margin-bottom:14px"><div class="card"><h3 style="margin-bottom:10px">Pontos fortes</h3><ul class="ins">${ins.f||'<li class="note">—</li>'}</ul></div><div class="card"><h3 style="margin-bottom:10px">Pontos de atenção</h3><ul class="ins">${ins.a||'<li class="note">Nada crítico encontrado.</li>'}</ul></div></div><div class="cols2" style="margin-bottom:14px">${cardFam}${cardAcao}</div>${cardMix}${cardPlano}`;
}
function insightsCliente(c,T){
  const rows=C.rows.filter(r=>r.cli===c.name), ls=[], tot=C.totAll;
  const sh1=tot.b>0?c.b/tot.b:0, sh0=tot.a>0?c.a/tot.a:0;
  ls.push(li(cls(pct(c.a,c.b))==='up'?'g':cls(pct(c.a,c.b))==='dn'?'r':'',`Receita <b>${fV(pct(c.a,c.b))}</b> (${fD(c.b-c.a)}). Participa com <b>${fP(sh1)}</b> da carteira (${META.y0}: ${fP(sh0)}, ${(sh1-sh0>=0?'+':'−')+Math.abs((sh1-sh0)*100).toFixed(1).replace('.',',')} p.p.).`));
  const {ms,t:ser}=monthSeries(rows);
  if(ms.length>1){
    const quedas=ser.filter(o=>o.b<o.a).length, l=ser.length-1;
    ls.push(li(quedas>ms.length/2?'y':'',`Abaixo de ${META.y0} em <b>${quedas} de ${ms.length}</b> meses.`+(ser[l].a>0?` Último mês (${MESC[ms[l]]}): ${fV(pct(ser[l].a,ser[l].b))}.`:'')));
  }
  const fam=ents(group(rows,r=>r.fam)), perdidas=fam.filter(x=>x.a>0&&x.b<=0).sort((x,y)=>y.a-x.a), novas=fam.filter(x=>x.a<=0&&x.b>0).sort((x,y)=>y.b-x.b);
  const queda=fam.filter(x=>x.a>0&&x.b>0&&x.b<x.a).sort((x,y)=>(x.b-x.a)-(y.b-y.a)), alta=fam.filter(x=>x.a>0&&x.b>x.a).sort((x,y)=>(y.b-y.a)-(x.b-x.a));
  if(perdidas.length)ls.push(li('r',`<b>${perdidas.length}</b> ${perdidas.length>1?'famílias deixaram':'família deixou'} de ser compradas (${fC(perdidas.reduce((s,x)=>s+x.a,0))} em ${META.y0}). Maiores: ${nomes(perdidas)}.`));
  if(novas.length)ls.push(li('g',`<b>${novas.length}</b> ${novas.length>1?'famílias novas':'família nova'} em ${META.y1} (${fC(novas.reduce((s,x)=>s+x.b,0))}). Destaque: ${nomes(novas)}.`));
  if(queda.length)ls.push(li('y',`Maior queda em família: <b>${esc(queda[0].name)}</b> (${fD(queda[0].b-queda[0].a)}, ${fV(pct(queda[0].a,queda[0].b))}).`));
  if(alta.length)ls.push(li('g',`Maior alta em família: <b>${esc(alta[0].name)}</b> (${fD(alta[0].b-alta[0].a)}, ${fV(pct(alta[0].a,alta[0].b))}).`));
  const topF=[...fam].sort((x,y)=>y.b-x.b).filter(x=>x.b>0);
  if(topF.length&&c.b>0){const s3=topF.slice(0,3).reduce((s,x)=>s+x.b,0)/c.b;ls.push(li(topF[0].b/c.b>0.4?'y':'',`Principal família: <b>${esc(topF[0].name)}</b> (${fP(topF[0].b/c.b)} da compra). As 3 maiores somam <b>${fP(s3)}</b>; o cliente compra <b>${topF.length}</b> famílias.`))}
  if(META.temQtd&&c.qa>0&&c.qb>0){const pa=c.a/c.qa,pb=c.b/c.qb,pm=tot.qb>0?tot.b/tot.qb:0;
    ls.push(li('',`Preço médio <b>${BRL2.format(pb)}/L</b> (${fV(pct(pa,pb))} vs ${META.y0})`+(pm>0?`, ${pb>=pm?'acima':'abaixo'} da média da carteira (${BRL2.format(pm)}/L).`:'.')))}
  if(META.temMc&&c.b>0){const m=c.mc/c.b,mm=tot.b>0?tot.mc/tot.b:0,d=(m-mm)*100;
    ls.push(li(d<-2?'y':d>2?'g':'',`MC de <b>${fP(m)}</b> (${fC(c.mc)}), ${Math.abs(d)<0.05?'igual à':(d>=0?'+':'−')+Math.abs(d).toFixed(1).replace('.',',')+' p.p. vs'} média da carteira (${fP(mm)}).`))}
  // oportunidades: famílias que a carteira compra e o cliente não
  const fora=r=>r.cli!==c.name||(C.codSel&&r.cod!==C.codSel);
  const outros=ents(group(C.rowsAll.filter(r=>fora(r)&&r.b>0),r=>r.fam),null), meus=new Map(fam.map(x=>[x.name,x]));
  const nCli=new Map();C.rowsAll.forEach(r=>{if(fora(r)&&r.b>0){(nCli.get(r.fam)||nCli.set(r.fam,new Set()).get(r.fam)).add(r.cli)}});
  const minC=META.clientes.length>=5?2:1;
  const opp=outros.filter(x=>x.b>0&&(!meus.get(x.name)||meus.get(x.name).b<=0)&&(nCli.get(x.name)||new Set()).size>=minC).sort((x,y)=>y.b-x.b).slice(0,6);
  if(opp.length)ls.push(li('y',`<b>Oportunidades de mix:</b> famílias vendidas aos demais clientes que este ainda não compra em ${META.y1}: ${opp.map(x=>`${esc(x.name)} <span class="note">(${fC(x.b)})</span>`).join(', ')}.`));
  return {html:ls.join(''),fam,perdidas,queda,alta};
}

function kpi(l,v,s,tag){return `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${tag||''} ${s||''}</div></div>`}
function vResumo(){
  const t=C.tot,{ms,t:ser}=monthSeries(C.rows), cl=ents(group(C.rows,r=>r.cli)), n0=cl.filter(x=>x.a>0).length, n1=cl.filter(x=>x.b>0).length;
  let h='<div class="kpis">';
  h+=kpi(`Receita líquida ${META.y1}`,fC(t.b),`${META.y0}: ${fC(t.a)}`,vtag(t.a,t.b));
  if(META.temQtd){h+=kpi(`Litros ${META.y1}`,fL(t.qb),`${META.y0}: ${fL(t.qa)}`,vtag(t.qa,t.qb));
    h+=kpi(`Preço médio ${META.y1}`,t.qb>0?BRL2.format(t.b/t.qb)+'/L':'—',`${META.y0}: ${t.qa>0?BRL2.format(t.a/t.qa)+'/L':'—'}`,t.qa>0&&t.qb>0?vtag(t.a/t.qa,t.b/t.qb):'')}
  if(META.temMc)h+=kpi(`MC % ${META.y1}`,t.b>0?fP(t.mc/t.b):'—',`margem de contribuição (${fC(t.mc)})`);
  h+=kpi('Clientes com compras',`${n1}`,`${META.y0}: ${n0}`);
  h+='</div>';
  const opts=[['b','Receita']].concat(META.temQtd?[['q','Litros'],['p','Preço médio']]:[]).concat(META.temMc?[['m','MC %']]:[]);
  const mt=opts.some(o=>o[0]===S.metric)?S.metric:'b';
  let cfg;
  if(mt==='b')cfg={ms,a:ser.map(o=>o.a),b:ser.map(o=>o.b),fmt:(v,ax)=>ax?fC(v).replace('R$ ',''):fC(v),label:'Receita líquida por mês'};
  else if(mt==='q')cfg={ms,a:ser.map(o=>o.qa),b:ser.map(o=>o.qb),fmt:(v,ax)=>ax?(Math.abs(v)>=1000?NUM.format(Math.round(v/1000))+' mil':NUM.format(v)):fL(v),label:'Litros por mês'};
  else if(mt==='p')cfg={ms,a:ser.map(o=>o.qa>0?o.a/o.qa:0),b:ser.map(o=>o.qb>0?o.b/o.qb:0),fmt:(v,ax)=>ax?v.toFixed(2).replace('.',','):BRL2.format(v),label:'Preço médio por mês'};
  else cfg={ms,a:null,b:ser.map(o=>o.b>0?o.mc/o.b:0),fmt:v=>fP(v),label:'MC % por mês',extra:i=>`MC: ${fC(ser[i].mc)} sobre receita de ${fC(ser[i].b)}`};
  cfg.hl=true;
  h+=`<div class="card"><div class="ch"><h3>${mt==='b'?'Receita líquida por mês':mt==='q'?'Litros por mês':mt==='p'?'Preço médio por mês (R$/L)':'MC % (margem de contribuição) por mês'}</h3>`;
  if(opts.length>1)h+=`<div class="seg">${opts.map(o=>`<button data-metric="${o[0]}" aria-pressed="${mt===o[0]}">${o[1]}</button>`).join('')}</div>`;
  h+=`</div>${chartBox('main',cfg,mt!=='m')}${mt==='m'?`<p class="note">MC % = margem de contribuição ÷ receita líquida do mês. Existe apenas para ${META.y1}.</p>`:''}</div>`;
  h+=blocosResumo();
  const ordered=cl.sort((x,y)=>y.b-x.b), tb=C.totAll.b;
  h+=`<div class="card"><h3 style="margin-bottom:10px">Clientes</h3><div class="tw"><table><thead><tr><th>Cliente</th><th class="r">${META.y1}</th><th class="r">Var.</th><th class="r hm">% total</th>${META.temMc?'<th class="r hm">MC %</th>':''}</tr></thead><tbody>${ordered.filter(x=>x.a||x.b).map(x=>`<tr class="row" data-go="${esc(x.name)}"><td>${esc(x.name)}</td><td class="r">${fC(x.b)}</td><td class="r">${vtag(x.a,x.b)}</td><td class="r hm">${tb>0?fP(x.b/tb):'—'}</td>${META.temMc?`<td class="r hm">${x.b>0?fP(x.mc/x.b):'—'}</td>`:''}</tr>`).join('')}</tbody></table></div><p class="note" style="margin-top:8px">Toque em um cliente para ver a análise completa.</p></div>`;
  return h;
}

      ${ufs.length>1?`<h4 class="sec">Por estado</h4><div class="pills">${ufs.map(u=>`<span>${esc(u.name)} · ${fC(u.b)}</span>`).join('')}</div>`:''}</div>`;

function vMarca(){
  const rows=C.rows,t=C.tot,y0=META.y0,y1=META.y1,SEP='\u0001';
  if(!META.emps.length)return '<div class="card">A planilha não tem a coluna <b>Grupo Empresa</b> (a marca), então não há como separar por marca.</div>';
  const bm=ents(group(rows,r=>r.emp)).filter(x=>x.a||x.b);
  if(!bm.length)return '<div class="card">Sem dados para os filtros escolhidos.</div>';
  const ord=[...bm].sort((x,y)=>META.emps.indexOf(x.name)-META.emps.indexOf(y.name));      /* cor segue a marca, não o ranking */
  const rank=[...bm].sort((x,y)=>y.b-x.b);
  const col=n=>`var(--b${Math.max(0,META.emps.indexOf(n))%4})`;
  const sq=n=>`<i class="sq" style="background:${col(n)}"></i>`;
  const nCli=new Map();group(rows,r=>r.emp+SEP+r.cli).forEach((o,k)=>{if(o.b>0){const e=k.split(SEP)[0];nCli.set(e,(nCli.get(e)||0)+1)}});
  const stack=(yr,key,tot)=>`<div class="srow"><span>${yr}</span><div class="stack">${ord.map(x=>{const p=tot>0?Math.max(0,x[key])/tot:0;return p>0?`<i style="width:${p*100}%;background:${col(x.name)}" title="${esc(x.name)}: ${fP(p)}">${p>=0.08?fP(p,0):''}</i>`:''}).join('')}</div></div>`;
  const tend=p=>p==null?['novo','up']:p>=0.02?['▲ crescendo','up']:p<=-0.02?['▼ caindo','dn']:['estável','neu'];
  const linhas=rank.map(x=>{const p=pct(x.a,x.b),[tx,tc]=tend(p);
    return `<tr><td><b>${sq(x.name)}${esc(x.name)}</b></td><td class="r hm">${fC(x.a)}</td><td class="r">${fC(x.b)}</td><td class="r">${vtag(x.a,x.b)}</td><td class="r hm">${t.a>0?fP(x.a/t.a):'—'}</td><td class="r">${t.b>0?fP(x.b/t.b):'—'}</td><td class="r hm">${nCli.get(x.name)||0}</td><td class="hm"><span class="tag ${tc}">${tx}</span></td></tr>`}).join('');
  const card1=`<div class="card"><h3 style="margin-bottom:10px">Participação das marcas na receita líquida</h3>
    <div class="leg">${ord.map(x=>`<span>${sq(x.name)}${esc(x.name)}</span>`).join('')}</div>${stack(y0,'a',t.a)}${stack(y1,'b',t.b)}
    <div class="tw" style="margin-top:12px"><table><thead><tr><th>Marca</th><th class="r hm">${y0}</th><th class="r">${y1}</th><th class="r">Var.</th><th class="r hm">Part. ${y0}</th><th class="r">Part. ${y1}</th><th class="r hm">Clientes</th><th class="hm">Tendência</th></tr></thead><tbody>${linhas}</tbody></table></div>
    <p class="note" style="margin-top:8px">Clientes = grupos (Matriz) com compra em ${y1}. Tendência: crescendo se a variação for de +2% ou mais, caindo se for de −2% ou menos.</p></div>`;
  const painel=x=>{const {ms,t:ser}=monthSeries(rows.filter(r=>r.emp===x.name));
    const cfg={ms,a:ser.map(o=>o.a),b:ser.map(o=>o.b),fmt:(v,ax)=>ax?fC(v).replace('R$ ',''):fC(v),label:'Receita mensal da marca '+x.name,h:200,hl:true};
    return `<div class="pnl"><div class="mh"><b>${sq(x.name)}${esc(x.name)}</b><span class="num">${fC(x.a)} → ${fC(x.b)} ${vtag(x.a,x.b)}</span></div>${chartBox('mk:'+x.name,cfg,false)}</div>`};
  const card2=`<div class="card"><h3 style="margin-bottom:8px">Receita líquida por mês, por marca</h3><div class="leg"><span><i style="background:var(--y0)"></i>${y0}</span><span><i style="background:var(--y1)"></i>${y1}</span></div><div class="mgrid">${ord.map(painel).join('')}</div></div>`;
  /* clientes por marca */
  const byCli=new Map();
  group(rows,r=>r.cli+SEP+r.emp).forEach((o,k)=>{const [c,e]=k.split(SEP);let z=byCli.get(c);if(!z){z={name:c,a:0,b:0,m:{}};byCli.set(c,z)}z.a+=o.a;z.b+=o.b;z.m[e]=o.b});
  const cl=[...byCli.values()].filter(x=>x.a||x.b).sort((x,y)=>y.b-x.b);
  const nb=x=>Object.values(x.m).filter(v=>v>0).length;
  const dist=new Map();cl.filter(x=>x.b>0).forEach(x=>{const n=nb(x),d=dist.get(n)||{n:0,v:0};d.n++;d.v+=x.b;dist.set(n,d)});
  const chipsC=[...dist].sort((x,y)=>y[0]-x[0]).map(([n,d])=>`<span class="chip${n===ord.length&&n>1?' up':''}"><b>${d.n}</b> ${d.n>1?'compram':'compra'} ${n===1?'1 marca':(n===ord.length?'as '+n+' marcas':n+' marcas')} · ${fC(d.v)}</span>`).join('');
  const card3=`<div class="card"><h3>Clientes por marca</h3><p class="note" style="margin:2px 0 10px">Receita de ${y1} de cada cliente em cada marca. Clientes agrupados por Matriz Razão.</p><div class="chips">${chipsC}</div>
    <div class="tw"><table><thead><tr><th>Cliente</th>${ord.map(x=>`<th class="r hm">${esc(x.name)} ${y1}</th>`).join('')}<th class="r hm">Total ${y0}</th><th class="r">Total ${y1}</th><th class="r">Var.</th></tr></thead><tbody>${cl.map(x=>`<tr><td>${esc(x.name)}</td>${ord.map(m=>`<td class="r hm">${x.m[m.name]>0?fR(x.m[m.name]):'—'}</td>`).join('')}<td class="r hm">${fR(x.a)}</td><td class="r"><b>${fR(x.b)}</b></td><td class="r">${vtag(x.a,x.b)}</td></tr>`).join('')}</tbody></table></div></div>`;
  return card1+card2+card3;
}

/* ---------- DIAGNÓSTICO DA BASE (calculado sobre a planilha inteira, sem filtros) ---------- */
function diagnostico(){
  const R=DATA.rows,y0=META.y0,y1=META.y1,SEP='\u0001',N=v=>NUM.format(v);
  const cnt=f=>R.reduce((s,r)=>s+(f(r)?1:0),0), val=(f,k)=>R.reduce((s,r)=>s+(f(r)?r[k]:0),0);
  const L=[];                                                    /* {k:'g'|'y'|'', t:texto} */
  const add=(k,t)=>L.push(li(k,t));
  let dup=0;const seen=new Set();
  R.forEach(r=>{const k=[r.cli,r.cod,r.mes,r.itemc,r.item,r.linha,r.fam,r.uf,r.emp,r.a,r.b,r.qa,r.qb,r.mc].join(SEP);if(seen.has(k))dup++;else seen.add(k)});
  dup?add('y',`<b>${N(dup)}</b> linhas exatamente duplicadas. Foram mantidas, porque a base não traz número de nota para confirmar se são repetidas.`):add('g','Nenhuma linha exatamente duplicada.');
  const nA=cnt(r=>r.a<0),nB=cnt(r=>r.b<0);
  (nA||nB)?add('y',`<b>${N(nA)}</b> linhas com receita negativa em ${y0} (${fC(val(r=>r.a<0,'a'))}) e <b>${N(nB)}</b> em ${y1} (${fC(val(r=>r.b<0,'b'))}). São devoluções maiores que a venda do item no mês e entram no líquido.`):add('g','Nenhuma linha com receita negativa.');
  if(META.temQtd){
    const zA=cnt(r=>r.a!==0&&r.qa===0),zB=cnt(r=>r.b!==0&&r.qb===0);
    (zA||zB)?add('y',`<b>${N(zB)}</b> linhas de ${y1} (e ${N(zA)} de ${y0}) têm receita, mas nenhum litro (${fC(val(r=>r.b!==0&&r.qb===0,'b'))} em ${y1}). Entram na receita; o efeito no preço médio é pequeno.`):add('g','Toda linha com receita tem litros informados.');
  }
  const codCli=new Map();R.forEach(r=>{if(!r.cod)return;(codCli.get(r.cod)||codCli.set(r.cod,new Set()).get(r.cod)).add(r.cli)});
  const multiRazao=[...codCli.values()].filter(s=>s.size>1).length;
  multiRazao?add('y',`<b>${N(multiRazao)}</b> códigos de cliente aparecem com mais de uma razão social. A análise usa a razão social (Matriz) de cada linha.`):add('g','Cada código de cliente tem uma única razão social (Matriz).');
  const cliCod=new Map();R.forEach(r=>{if(!r.cod)return;(cliCod.get(r.cli)||cliCod.set(r.cli,new Set()).get(r.cli)).add(r.cod)});
  const grupos=[...cliCod.values()].filter(s=>s.size>1).length;
  if(grupos)add('',`<b>${N(grupos)}</b> ${grupos>1?'clientes (grupos) têm':'cliente (grupo) tem'} mais de um código (${N(codCli.size)} códigos no total). A análise é por grupo; o filtro <b>Cliente</b> permite ver cada código separadamente.`);
  const codUf=new Map();R.forEach(r=>{if(!r.cod)return;(codUf.get(r.cod)||codUf.set(r.cod,new Set()).get(r.cod)).add(r.uf)});
  const multiUf=[...codUf.values()].filter(s=>s.size>1).length;
  multiUf?add('y',`<b>${N(multiUf)}</b> códigos de cliente aparecem em mais de um estado.`):add('g','Cada código de cliente está em um único estado.');
  (META.itensMultiNome?add('y',`<b>${N(META.itensMultiNome)}</b> ${META.itensMultiNome>1?'códigos de item têm':'código de item tem'} mais de um nome. Foi usado o nome mais frequente.`):add('g','Cada código de item tem um único nome.'));
  const famLin=new Map();R.forEach(r=>{(famLin.get(r.fam)||famLin.set(r.fam,new Set()).get(r.fam)).add(r.linha)});
  const multiLin=[...famLin.values()].filter(s=>s.size>1).length;
  multiLin?add('y',`<b>${N(multiLin)}</b> famílias aparecem em mais de uma linha comercial.`):add('g','Cada família pertence a uma única linha comercial.');
  const campos=[['Estado','uf'],['Marca (Grupo Empresa)','emp'],['Linha Comercial','linha'],['Família Comercial','fam']].map(([n,k])=>[n,cnt(r=>r[k]==='—')]).filter(x=>x[1]>0);
  campos.length?add('y',`Campos vazios ou ausentes: ${campos.map(x=>`${x[0]} (${x[1]===R.length?'coluna não encontrada':N(x[1])+' linhas'})`).join('; ')}.`):add('g','Sem campos vazios em cliente, produto, estado e marca.');
  META.descartadas?add('y',`<b>${N(META.descartadas)}</b> linhas da planilha foram ignoradas por não terem mês ou cliente reconhecido.`):add('g',`Todas as ${N(META.totalLinhas)} linhas da planilha foram lidas.`);
  const soA=cnt(r=>r.a!==0&&r.b===0),soB=cnt(r=>r.a===0&&r.b!==0),zero=cnt(r=>r.a===0&&r.b===0);
  add('',`<b>${N(soA)}</b> linhas só têm receita em ${y0} e <b>${N(soB)}</b> só em ${y1}: são produtos e clientes que entraram ou saíram entre os períodos, o que é normal.${zero?` Há ainda ${N(zero)} linhas sem receita nos dois anos; elas não alteram os totais.`:''}`);
  if(META.temMc){
    const mA=cnt(r=>r.mc!==0&&r.b===0),mB=cnt(r=>r.b!==0&&r.mc===0);
    (mA||mB)?add('y',`${mA?`<b>${N(mA)}</b> linhas têm MC, mas receita zero em ${y1} (ajustes).`:''} ${mB?`<b>${N(mB)}</b> linhas com receita estão sem MC.`:''} A MC % considera todas as linhas.`):add('g',`A MC está preenchida em todas as linhas com receita em ${y1}.`);
  }
  if(META.ignoradas.length)add('y',`Colunas da planilha que o dashboard <b>não usa</b>: ${META.ignoradas.map(esc).join(', ')}.`);
  add('y','<b>Não está na planilha:</b> meta de vendas, custo e margem bruta (retirados da versão publicada), cidade, dia da venda e a causa das variações. Por isso não há atingimento de meta, análise por cidade ou por dia.');
  return L.join('');
}
function vBase(){
  const R=DATA.rows,y0=META.y0,y1=META.y1,N=v=>NUM.format(v);
  const fams=new Set(R.map(r=>r.fam)).size, itens=new Set(R.map(r=>r.itemc||r.item)).size, cods=new Set(R.filter(r=>r.cod).map(r=>r.cod)).size;
  const tiles=`<div class="kpis">${kpi('Linhas',N(R.length),'cliente × item × mês')}${kpi('Meses',String(META.months.length),`${MES[META.months[0]]} a ${MES[META.months[META.months.length-1]]}, ${y0} e ${y1}`)}${kpi('Clientes',String(META.clientes.length),cods?`${N(cods)} códigos únicos`:'grupos (Matriz Razão)')}${kpi('Estados e marcas',`${META.ufs.length} · ${META.emps.length}`,`${META.ufs.length} estados · ${META.emps.length} marcas`)}${kpi('Produtos',`${N(fams)} famílias`,`${N(itens)} itens`)}</div>`;
  const regras=[
    li('',`Receita = coluna <b>R$ Líquido</b>. Comparação do mesmo período: ${MES[META.months[0]]}–${MES[META.months[META.months.length-1]]} de ${y1} contra o mesmo intervalo de ${y0}.`),
    li('',`Cliente ativo = receita líquida maior que zero em ${y1}. Cliente é o grupo (Matriz Razão); o filtro Cliente também mostra cada código.`),
    li('',`Marca = coluna <b>Grupo Empresa</b>. Tendência da marca: crescendo com variação de +2% ou mais, caindo com −2% ou menos.`),
    li('',`Situação de cliente ou família: <b>Novo</b> (sem compra em ${y0}), <b>Perdido</b> (sem compra em ${y1}), <b>Em queda</b> (mais de 10% abaixo), <b>Em alta</b> (mais de 10% acima), <b>Estável</b>.`),
    li('',`Preço médio = receita líquida ÷ litros. MC % = margem de contribuição ÷ receita líquida de ${y1} (a MC só existe para ${y1}).`),
    li('',`Perdidos (Onde agir primeiro) = combinações de cliente × família que compraram em ${y0} e não compraram em ${y1}. Em queda = combinações que compraram menos.`),
    li('',`Oportunidade de mix = família comprada por pelo menos 2 clientes que outros clientes ativos ainda não compram. <b>Potencial estimado</b> = clientes sem a família × ticket médio de quem compra. É uma estimativa inferida, não garantia de resultado.`),
    li('',`Plano de ação: prioridade <b>Alta</b> para famílias perdidas e clientes em queda; <b>Média</b> para mix, clientes que zeraram e linha comercial em queda. A carteira é considerada concentrada quando 3 clientes passam de 80% da receita.`),
    li('y',`Limites dos insights: eles só enxergam números. O motivo de uma queda (obra que acabou, ruptura, mudança de comprador) não está na base.`)
  ].join('');
  return `<p class="note" style="margin:0 0 12px">O que foi lido do arquivo e as regras usadas nos cálculos. ${META.modificado?'Arquivo atualizado em '+esc(META.modificado)+'.':''}</p>${tiles}
  <div class="cols2"><div class="card"><h3 style="margin-bottom:10px">Qualidade dos dados</h3><ul class="ins">${diagnostico()}</ul></div>
  <div class="card"><h3 style="margin-bottom:10px">Regras dos indicadores</h3><ul class="ins">${regras}</ul></div></div>`;
}
const TABS=[['res','Resumo',vResumo],['cli','Clientes',vClientes],['fam','Famílias',vFam],['item','Itens',vItem],['marca','Marca',vMarca],['linha','Linhas',vLinha],['uf','Estados',vUf],['base','Diagnóstico da base',vBase]];

function drawFilters(){
  const sel=(id,l,opts,val)=>`<label>${l}<select id="${id}">${opts.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(val)?'selected':''}>${esc(o[1])}</option>`).join('')}</select></label>`;
  let h='';
  if(META.emps.length>1)h+=sel('f-emp','Empresa',[['','Todas']].concat(META.emps.map(x=>[x,x])),S.emp);
  if(META.ufs.length>1)h+=sel('f-uf','Estado',[['','Todos']].concat(META.ufs.map(x=>[x,x])),S.uf);
  if(META.clientes.length>1||META.codsTotal>META.clientes.length){
    let o=`<option value="">Todos</option>`;
    for(const c of META.clientes){
      const cs=META.cods[c]||[];
      if(cs.length>1){o+=`<optgroup label="${esc(c)}"><option value="m:${esc(c)}" ${S.cli==='m:'+c?'selected':''}>Todos os códigos</option>`+cs.map(x=>`<option value="c:${esc(x.cod)}" ${S.cli==='c:'+x.cod?'selected':''}>Cód. ${esc(x.cod)}${x.uf&&x.uf!=='—'?' · '+esc(x.uf):''}</option>`).join('')+'</optgroup>'}
      else o+=`<option value="m:${esc(c)}" ${S.cli==='m:'+c?'selected':''}>${esc(c)}${cs[0]&&cs[0].cod?' · cód. '+esc(cs[0].cod):''}</option>`;
    }
    h+=`<label class="full">Cliente<select id="f-cli">${o}</select></label>`;
  }
  if(META.months.length>1){const mo=META.months.map(m=>[m,MESC[m]]);h+=sel('f-m0','De',mo,S.m0)+sel('f-m1','Até',mo,S.m1)}
  $('#filters').innerHTML=h;
}
function drawTabs(){$('#tabs').innerHTML=TABS.map(t=>`<button class="tab" role="tab" data-tab="${t[0]}" aria-selected="${S.tab===t[0]}">${t[1]}</button>`).join('')}
const k0=()=>S.cli.slice(2);
function draw(){
  const rowsAll=DATA.rows.filter(r=>(!S.emp||r.emp===S.emp)&&(!S.uf||r.uf===S.uf)&&r.mes>=S.m0&&r.mes<=S.m1);
  const k=S.cli.slice(2), rows=!S.cli?rowsAll:rowsAll.filter(r=>S.cli[0]==='m'?r.cli===k:r.cod===k);
  C={rows,rowsAll,tot:sum(rows),totAll:sum(rowsAll),codSel:S.cli[0]==='c'?k:''};

  $('#sub').textContent=`Receita líquida · ${lbl} ${META.y1} contra ${META.y0}`+(S.emp?` · ${S.emp}`:'')+(S.uf?` · ${S.uf}`:'')+(S.cli?` · ${S.cli[0]==='c'?(META.codMat[k0()]||'')+' (cód. '+k0()+')':S.cli.slice(2)}`:'');
  const tab=TABS.find(t=>t[0]===S.tab)||TABS[0];

function iniciar(tabela,nome,modificado){
  const d=padronizar(tabela);
  DATA=d;
  const u=(f)=>[...new Set(d.rows.map(f))].sort();
  META={y0:d.y0,y1:d.y1,temMc:d.temMc,temQtd:d.temQtd,ignoradas:d.ignoradas,arquivo:nome,modificado,
    months:[...new Set(d.rows.map(r=>r.mes))].sort((a,b)=>a-b),emps:u(r=>r.emp).filter(x=>x!=='—'),ufs:u(r=>r.uf).filter(x=>x!=='—'),clientes:u(r=>r.cli)};
  META.descartadas=d.descartadas;META.itensMultiNome=d.itensMultiNome;META.totalLinhas=d.totalLinhas;
  META.cods={};META.codMat={};
  {const g=new Map();d.rows.forEach(r=>{if(!r.cod)return;const key=r.cli+'\u0001'+r.cod;let o=g.get(key);if(!o){o={cli:r.cli,cod:r.cod,uf:{}};g.set(key,o)}o.uf[r.uf]=(o.uf[r.uf]||0)+Math.abs(r.a)+Math.abs(r.b)});
   g.forEach(o=>{const uf=Object.entries(o.uf).sort((x,y)=>y[1]-x[1])[0][0];(META.cods[o.cli]=META.cods[o.cli]||[]).push({cod:o.cod,uf});META.codMat[o.cod]=o.cli});
   Object.values(META.cods).forEach(a=>a.sort((x,y)=>x.cod.localeCompare(y.cod,'pt',{numeric:true})));META.codsTotal=g.size}
  S.m0=META.months[0];S.m1=META.months[META.months.length-1];
  $('#loader').innerHTML='';$('#main').hidden=false;
  $('#foot').textContent=`Base: ${nome}${modificado?' · atualizada em '+modificado:''} · ${NUM.format(d.rows.length)} linhas`;
  draw();
}
async function processar(buf,nome,modificado){
  let tabela;
  if(/\.csv$/i.test(nome))tabela=lerCsv(new TextDecoder('utf-8').decode(buf).replace(/^﻿/,''));
  else tabela=await lerXlsx(buf);
  iniciar(tabela,nome,modificado);
}
function pedirArquivo(msg){
  $('#sub').textContent='Aguardando a planilha';
  $('#loader').innerHTML=`<div class="drop"><h2>Selecione a planilha de vendas</h2><p class="note">${msg}</p>
  <label class="btn">Escolher arquivo (.xlsx ou .csv)<input id="file" type="file" accept=".xlsx,.csv" hidden></label><div id="err"></div></div>`;
  $('#file').addEventListener('change',async e=>{
    const f=e.target.files[0];if(!f)return;
    try{await processar(await f.arrayBuffer(),f.name,new Date(f.lastModified).toLocaleDateString('pt-BR'))}
    catch(err){$('#err').innerHTML=`<div class="err">${esc(err.message)}</div>`}
  });
}
/* ---- acesso: usuário + senha destravam o arquivo dados.enc (AES-256-GCM, chave derivada por PBKDF2) ---- */
const te=new TextEncoder();
const b64e=u8=>btoa(String.fromCharCode(...new Uint8Array(u8)));
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function chaveDe(usuario,senha){
  const u=usuario.trim().toLowerCase();
  const base=await crypto.subtle.importKey('raw',te.encode(u+'\u0000'+senha),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:te.encode('dashboard-vendas:v1:'+u),iterations:600000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function abrir(u8,key){try{return await crypto.subtle.decrypt({name:'AES-GCM',iv:u8.slice(4,16)},key,u8.slice(16))}catch(_){return null}}
async function entrar(pt,mod){
  const tabela=await lerXlsx(pt);
  $('#sair').hidden=false;
  iniciar(tabela,'dados.enc (criptografado)',mod);
}
function mostrarLogin(u8,mod){
  $('#sub').textContent='Acesso restrito';
  $('#loader').innerHTML=`<form class="drop login" id="login"><h2>Entrar</h2><p class="note">Digite o usuário e a senha para ver o dashboard.</p>
  <label>Usuário<input id="lu" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" required></label>
  <label>Senha<input id="ls" name="password" type="password" autocomplete="current-password" required></label>
  <label class="chk"><input id="lc" type="checkbox"> Manter conectado neste aparelho</label>
  <button class="btn" id="lb" type="submit">Entrar</button><div id="lm" class="err" hidden></div></form>`;
  try{const ul=localStorage.getItem('dsh_user');if(ul)$('#lu').value=ul}catch(_){}
  $('#login').addEventListener('submit',async e=>{
    e.preventDefault();const b=$('#lb'),m=$('#lm');b.disabled=true;b.textContent='Verificando…';m.hidden=true;
    try{
      const key=await chaveDe($('#lu').value,$('#ls').value), pt=await abrir(u8,key);
      if(!pt){m.textContent='Usuário ou senha incorretos.';m.hidden=false;b.disabled=false;b.textContent='Entrar';$('#ls').value='';$('#ls').focus();return}
      const raw=b64e(await crypto.subtle.exportKey('raw',key));
      try{sessionStorage.setItem('dsh_key',raw);if($('#lc').checked){localStorage.setItem('dsh_key',raw);localStorage.setItem('dsh_user',$('#lu').value.trim())}}catch(_){}
      await entrar(pt,mod);
    }catch(err){m.textContent='Não foi possível abrir os dados: '+err.message;m.hidden=false;b.disabled=false;b.textContent='Entrar'}
  });
  ($('#lu').value?$('#ls'):$('#lu')).focus();
}
$('#sair').addEventListener('click',()=>{try{sessionStorage.removeItem('dsh_key');localStorage.removeItem('dsh_key')}catch(_){}location.reload()});
(async function(){
  if(!(window.crypto&&crypto.subtle)){pedirArquivo('Este navegador não consegue abrir o acesso protegido (é preciso uma conexão segura, https). Você pode escolher uma planilha do seu computador para ver os dados.');return}
  let achou=null;
  try{
    const r=await fetch('dados.enc?v='+Date.now());
    if(r.ok&&!(r.headers.get('content-type')||'').includes('text/html')){const lm=r.headers.get('last-modified');achou={buf:await r.arrayBuffer(),mod:lm?new Date(lm).toLocaleDateString('pt-BR'):''}}
  }catch(_){}
  if(!achou){pedirArquivo('Não encontrei o arquivo <b>dados.enc</b> junto com o site. Publicado no GitHub/Vercel ele é lido automaticamente; para ver agora, escolha uma planilha do seu computador.');return}
  const u8=new Uint8Array(achou.buf);
  if(String.fromCharCode(...u8.slice(0,4))!=='DSH1'){pedirArquivo('');$('#err').innerHTML='<div class="err">O arquivo dados.enc não está no formato esperado. Gere-o de novo com a ferramenta criptografar.html.</div>';return}
  for(const store of ['sessionStorage','localStorage']){
    try{const k=window[store].getItem('dsh_key');if(!k)continue;const key=await crypto.subtle.importKey('raw',b64d(k),'AES-GCM',false,['decrypt']);const pt=await abrir(u8,key);if(pt){await entrar(pt,achou.mod);return}}catch(_){}
  }
  mostrarLogin(u8,achou.mod);
})();
})();
</script>
